<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TDR MODZ Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#050811;--card-bg:rgba(15,23,42,0.75);--input-bg:rgba(10,15,29,0.6);--border-color:rgba(255,255,255,0.08);--accent-gradient:linear-gradient(135deg,#6366f1 0%,#a855f7 50%,#ec4899 100%);--btn-gradient:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);--accent-primary:#6366f1;--accent-success:#10b981;--accent-warning:#f59e0b;--accent-danger:#ef4444;--text-primary:#f8fafc;--text-secondary:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;}
body{background:var(--bg-color);color:var(--text-primary);min-height:100vh;background-image:radial-gradient(at 10% 10%,rgba(99,102,241,0.12) 0px,transparent 40%),radial-gradient(at 90% 90%,rgba(168,85,247,0.12) 0px,transparent 40%);background-attachment:fixed;overflow-x:hidden;display:flex;}
#loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-color);display:flex;justify-content:center;align-items:center;z-index:9999;}
.login-card{background:var(--card-bg);backdrop-filter:blur(20px);padding:40px 30px;border-radius:20px;border:1px solid var(--border-color);width:90%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.5);}
.login-card h1{font-size:24px;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
.login-card p{font-size:12px;color:var(--text-secondary);margin-bottom:24px;}
.sidebar{width:270px;background:var(--card-bg);backdrop-filter:blur(20px);border-right:1px solid var(--border-color);display:flex;flex-direction:column;padding:24px 16px;flex-shrink:0;min-height:100vh;}
.sidebar h2{font-size:18px;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px;padding:0 8px;}
.nav-btn{background:transparent;color:var(--text-secondary);border:1px solid transparent;padding:12px 14px;width:100%;text-align:left;font-size:13px;font-weight:600;border-radius:12px;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:10px;transition:all 0.2s ease;}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:#fff;border-color:var(--border-color);}
.nav-btn.active{background:var(--btn-gradient);color:#fff;box-shadow:0 8px 20px rgba(99,102,241,0.3);border:none;}
.main-content{flex:1;padding:24px 28px;overflow-y:auto;display:flex;flex-direction:column;min-height:100vh;}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.header-info{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text-secondary);}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-success);box-shadow:0 0 10px var(--accent-success);}
.page-section{display:none;background:var(--card-bg);backdrop-filter:blur(20px);padding:24px;border-radius:20px;border:1px solid var(--border-color);margin-bottom:20px;box-shadow:0 20px 40px rgba(0,0,0,0.5);}
.page-section.active{display:block;}
h3{color:#fff;font-size:18px;margin-bottom:18px;font-weight:800;border-bottom:1px solid var(--border-color);padding-bottom:12px;}
input,select,textarea{width:100%;padding:10px 14px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:10px;color:var(--text-primary);font-size:13px;outline:none;transition:all 0.2s ease;}
input:focus,select:focus,textarea:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px rgba(99,102,241,0.2);}
textarea{height:320px;font-family:'Fira Code',monospace;font-size:12px;color:#818cf8;resize:vertical;margin-top:8px;}
button{padding:10px 16px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
button:active{transform:scale(0.97);}
button:hover{filter:brightness(1.15);}
.btn-load{background:rgba(255,255,255,0.05);color:#fff;border:1px solid var(--border-color);}
.btn-save{background:var(--btn-gradient);color:white;width:100%;padding:16px;font-size:15px;font-weight:800;margin-top:20px;border-radius:14px;box-shadow:0 10px 25px rgba(99,102,241,0.3);}
button.warning{background:rgba(245,158,11,0.2);color:#fbbf24;border:1px solid rgba(245,158,11,0.4);}
button.danger{background:rgba(239,68,68,0.2);color:#f87171;border:1px solid rgba(239,68,68,0.4);}
button.success{background:rgba(16,185,129,0.2);color:#34d399;border:1px solid rgba(16,185,129,0.4);}
.add-section{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;background:rgba(255,255,255,0.02);padding:16px;border-radius:14px;border:1px solid var(--border-color);}
.inputs-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.key-single-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.02);padding:12px 16px;border-radius:10px;margin-bottom:8px;border:1px solid var(--border-color);gap:10px;flex-wrap:wrap;}
.key-info-inline{display:flex;align-items:center;gap:12px;font-size:12px;flex-wrap:wrap;flex:1;}
.serial-num{font-weight:800;color:var(--accent-primary);min-width:24px;}
.key-code{font-family:'Fira Code',monospace;font-weight:700;color:#fff;}
.badge{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,0.05);color:var(--text-secondary);border:1px solid var(--border-color);}
.badge.creator{color:#818cf8;}
.badge.devices{color:#34d399;}
.badge.expiry{color:#fbbf24;}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-card{background:#0f172a;border:1px solid var(--border-color);border-radius:20px;width:100%;max-width:520px;padding:24px;box-shadow:0 25px 50px rgba(0,0,0,0.5);max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border-color);padding-bottom:12px;}
.modal-body{display:flex;flex-direction:column;gap:14px;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.label-small{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:6px;font-weight:600;}
.reseller-item{background:rgba(255,255,255,0.02);padding:16px;border-radius:14px;margin-bottom:12px;border:1px solid var(--border-color);border-left:4px solid var(--accent-primary);}
.reseller-info-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;color:var(--text-secondary);flex-wrap:wrap;gap:8px;}
.reseller-info-header span{color:#a855f7;font-weight:700;}
.badges-holder{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.live-credit-badge{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.3);padding:4px 10px;border-radius:8px;font-weight:800;font-size:11px;}
.used-credit-badge{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);padding:4px 10px;border-radius:8px;font-weight:800;font-size:11px;}
.inputs-group-reseller{display:grid;grid-template-columns:1.5fr 1.2fr 1.2fr auto auto;gap:8px;align-items:center;}
.lua-item{background:var(--input-bg);padding:10px 14px;border-radius:10px;margin-bottom:8px;border:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}
#status{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;}
.success-status{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.3);}
.error-status{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
.loading-status{background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);}
@media (max-width:768px){body{flex-direction:column;}.sidebar{width:100%;min-height:auto;}.main-content{padding:16px;}.inputs-group-reseller{grid-template-columns:1fr;}.inputs-row{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-card">
<h1>🔐 TDR MODZ</h1>
<p>Master Admin Panel</p>
<input type="password" id="adminPass" placeholder="Enter Admin Password" style="margin-bottom:12px;">
<button onclick="tryLogin()" style="background:var(--btn-gradient);color:white;width:100%;padding:14px;">🔓 Login</button>
<p id="loginError" style="color:#f87171;margin-top:12px;font-size:12px;"></p>
</div>
</div>

<div id="mainApp" style="display:none;width:100%;">
<div class="sidebar">
<h2>🔐 TDR MODZ Admin</h2>
<button class="nav-btn active" onclick="switchPage('userKeysPage',this)">🔑 User Keys</button>
<button class="nav-btn" onclick="switchPage('resellerPage',this)">👤 Resellers</button>
<button class="nav-btn" onclick="switchPage('maintPage',this)">🛠️ Maintenance</button>
<button class="nav-btn" onclick="switchPage('luaUpdatePage',this)">📜 Lua Update</button>
<button class="nav-btn" onclick="switchPage('uiPage',this)">🎨 UI Panel</button>
<button class="nav-btn" onclick="logout()" style="margin-top:auto;color:#f87171;">🚪 Logout</button>
</div>

<div class="main-content">
<div class="header-bar">
<div class="header-info"><span class="status-dot"></span><span id="connectionStatus">Connected to Firebase</span></div>
<button onclick="loadAllData()" class="btn-load">🔄 Reload Data</button>
</div>

<div id="userKeysPage" class="page-section active">
<h3>🔑 User Keys Manager</h3>
<div class="add-section">
<div class="inputs-row">
<input type="text" id="newKeyInput" placeholder="User Key (or leave blank for auto)">
<input type="number" id="newDeviceLimitInput" placeholder="Device Limit" value="1" min="1">
<select id="newValiditySelect">
<option value="1h">1 Hour</option>
<option value="1d">1 Day</option>
<option value="3d">3 Days</option>
<option value="7d" selected>7 Days</option>
<option value="10d">10 Days</option>
<option value="15d">15 Days</option>
<option value="30d">30 Days</option>
</select>
<input type="text" id="newNoteInput" placeholder="Note (customer name)">
</div>
<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
<button onclick="generateRandomKey()" class="btn-load" style="flex:1;">🎲 Random Key</button>
<button onclick="addKey()" class="success" style="flex:2;">➕ Add Key to Firebase</button>
</div>
</div>
<div id="keyList"></div>
</div>

<div id="resellerPage" class="page-section">
<h3>👤 Reseller Manager</h3>
<div class="add-section">
<div class="inputs-row">
<input type="text" id="resellerPass" placeholder="Reseller Password">
<input type="number" id="resellerCredit" placeholder="Credit Balance" value="50">
<input type="date" id="resellerExpiry">
</div>
<button onclick="addReseller()" style="background:var(--btn-gradient);color:white;">➕ Create Reseller</button>
</div>
<div id="resellerList"></div>
</div>

<div id="maintPage" class="page-section">
<h3>🛠️ Maintenance Control</h3>
<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
<label style="font-size:13px;color:var(--text-secondary);"><input type="checkbox" id="maintEnabled" style="width:auto;margin-right:8px;"> Enable Maintenance Mode</label>
<input type="text" id="maintMsg" placeholder="Maintenance Message">
<input type="url" id="maintUrl" placeholder="Update URL (Telegram)">
<input type="text" id="maintMinVer" placeholder="Min App Version (e.g. root-10)">
<input type="text" id="maintLatestVer" placeholder="Latest App Version">
<input type="text" id="maintLuaVer" placeholder="Lua Version (e.g. 1.0.0)">
<input type="text" id="maintZipName" placeholder="Update Zip Name (e.g. engine3.zip)">
</div>
<button onclick="saveMaintenance()" class="success" style="width:100%;">💾 Save Maintenance Config</button>
</div>

<div id="luaUpdatePage" class="page-section">
<h3>📜 Online Lua Update</h3>
<input type="text" id="luaVersionInput" placeholder="Lua Version e.g. 1.0.1" style="margin-bottom:16px;">
<div style="border:2px dashed var(--border-color);padding:20px;text-align:center;border-radius:12px;cursor:pointer;background:var(--input-bg);margin-bottom:16px;" onclick="document.getElementById('luaFileInput').click()">
<span>📁 Click to select .lua files</span>
<input type="file" id="luaFileInput" multiple accept=".lua" style="display:none" onchange="handleLuaFiles(event)">
</div>
<div id="luaFilesContainer"></div>
<button onclick="saveLuaFiles()" class="success" style="width:100%;margin-top:10px;">💾 Save Lua Files</button>
</div>

<div id="uiPage" class="page-section">
<h3>🎨 Reseller HTML Panel</h3>
<textarea id="appHtmlCode" placeholder="Paste HTML here..."></textarea>
<button onclick="saveHtmlPanel()" class="success" style="width:100%;margin-top:10px;">💾 Save HTML Panel</button>
</div>

<div id="status"></div>
</div>
</div>

<div id="editKeyModal" class="modal-overlay">
<div class="modal-card">
<div class="modal-header">
<h4 style="color:#fff;">✏️ Edit Key</h4>
<span onclick="closeModal()" style="cursor:pointer;font-size:20px;color:var(--text-secondary);">✕</span>
</div>
<div class="modal-body">
<input type="hidden" id="modalKeyId">
<div><label class="label-small">Key Code</label><input type="text" id="modalKeyInput"></div>
<div><label class="label-small">Device Limit</label><input type="number" id="modalLimitInput" min="1"></div>
<div><label class="label-small">Note</label><input type="text" id="modalNoteInput"></div>
<div><label class="label-small">Validity Type</label>
<select id="modalValidityInput">
<option value="1h">1 Hour</option>
<option value="1d">1 Day</option>
<option value="3d">3 Days</option>
<option value="7d">7 Days</option>
<option value="10d">10 Days</option>
<option value="15d">15 Days</option>
<option value="30d">30 Days</option>
</select></div>
</div>
<div class="modal-footer">
<button onclick="closeModal()" class="btn-load">Cancel</button>
<button onclick="updateKey()" class="success">💾 Update</button>
</div>
</div>
</div>

<script>
const WORKER_URL="https://tdr-modz-api.sukunaid43.workers.dev";
const API_SECRET="TDR_MODZ_2026_SecureKey_abc123def456ghi789";
const ADMIN_PASSWORD="TDR_Admin@2026";
let currentData={keys:[],resellers:[],maintenance:{},lua_files:{}};

function tryLogin(){const p=document.getElementById('adminPass').value;if(p===ADMIN_PASSWORD){localStorage.setItem('admin_pass',p);document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='flex';loadAllData();}else{document.getElementById('loginError').textContent='❌ Wrong password!';}}
function logout(){if(confirm("Logout?")){localStorage.removeItem('admin_pass');location.reload();}}
function switchPage(id,btn){document.querySelectorAll('.page-section').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');}
function setStatus(msg,type='loading-status'){const e=document.getElementById('status');e.textContent=msg;e.className=type;if(type==='success-status')setTimeout(()=>{e.textContent='';},3000);}
async function callAPI(action,data={}){data.action=action;data.secret=API_SECRET;try{const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return await r.json();}catch(e){return{success:false,error:e.message};}}
async function loadAllData(){setStatus('⏳ Loading...','loading-status');
const k=await callAPI('get_keys');if(k.success){currentData.keys=k.keys||[];renderKeys();}
const c=await callAPI('get_config');if(c.success&&c.config){const x=c.config;currentData.maintenance=x;document.getElementById('maintEnabled').checked=x.maintenance_enabled===true;document.getElementById('maintMsg').value=x.maintenance_message||'';document.getElementById('maintUrl').value=x.update_url||'';document.getElementById('maintMinVer').value=x.min_app_version||'';document.getElementById('maintLatestVer').value=x.latest_app_version||'';document.getElementById('maintLuaVer').value=x.lua_version||'1.0.0';document.getElementById('maintZipName').value=x.update_zip_name||'';document.getElementById('luaVersionInput').value=x.lua_version||'1.0.0';}
const r=await callAPI('get_resellers');if(r.success){currentData.resellers=r.resellers||[];renderResellers();}
const l=await callAPI('get_lua_files');if(l.success){currentData.lua_files=l.lua_files||{};renderLuaFilesList();}
setStatus('✅ Loaded!','success-status');}
function generateRandomKey(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let k='TDR-';for(let i=0;i<4;i++)k+=c[Math.floor(Math.random()*c.length)];k+='-';for(let i=0;i<4;i++)k+=c[Math.floor(Math.random()*c.length)];document.getElementById('newKeyInput').value=k;}
async function addKey(){let k=document.getElementById('newKeyInput').value.trim();if(!k){generateRandomKey();k=document.getElementById('newKeyInput').value;}
const dl=parseInt(document.getElementById('newDeviceLimitInput').value)||1;
const vt=document.getElementById('newValiditySelect').value;
const n=document.getElementById('newNoteInput').value.trim()||'No note';
setStatus('⏳ Adding key...','loading-status');
const r=await callAPI('admin_add_key',{key:k,device_limit:dl,validity_type:vt,note:n});
if(r.success){setStatus('✅ Key added: '+k,'success-status');document.getElementById('newKeyInput').value='';document.getElementById('newNoteInput').value='';loadAllData();}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
function renderKeys(){const c=document.getElementById('keyList');c.innerHTML='';if(currentData.keys.length===0){c.innerHTML='<p style="text-align:center;color:#94a3b8;padding:20px;">No keys yet</p>';return;}
currentData.keys.forEach((item,i)=>{const d=document.createElement('div');d.className='key-single-row';const dl=item.device_limit||1;const dv=item.devices||[];
d.innerHTML=`<div class="key-info-inline"><span class="serial-num">${i+1}.</span><span class="key-code">${item.key}</span><span class="badge creator">📝 ${item.note||'No note'}</span><span class="badge devices">📱 ${dv.length}/${dl}</span><span class="badge expiry">⏳ ${item.validity_type||'30d'}</span></div><div style="display:flex;gap:6px;"><button class="warning" onclick="openEditModal('${item.doc_id}')" style="padding:6px 10px;font-size:11px;">✏️</button><button class="danger" onclick="deleteKey('${item.doc_id}','${item.key}')" style="padding:6px 10px;font-size:11px;">🗑️</button></div>`;
c.appendChild(d);});}
function openEditModal(id){const it=currentData.keys.find(k=>k.doc_id===id);if(!it)return;
document.getElementById('modalKeyId').value=id;
document.getElementById('modalKeyInput').value=it.key||'';
document.getElementById('modalLimitInput').value=it.device_limit||1;
document.getElementById('modalNoteInput').value=it.note||'';
document.getElementById('modalValidityInput').value=it.validity_type||'30d';
document.getElementById('editKeyModal').classList.add('active');}
function closeModal(){document.getElementById('editKeyModal').classList.remove('active');}
async function updateKey(){const id=document.getElementById('modalKeyId').value;setStatus('⏳ Updating...','loading-status');
const r=await callAPI('admin_update_key',{doc_id:id,key:document.getElementById('modalKeyInput').value.trim(),device_limit:parseInt(document.getElementById('modalLimitInput').value)||1,note:document.getElementById('modalNoteInput').value.trim(),validity_type:document.getElementById('modalValidityInput').value});
if(r.success){setStatus('✅ Updated!','success-status');closeModal();loadAllData();}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
async function deleteKey(id,name){if(!confirm('Delete key "'+name+'"?'))return;setStatus('⏳ Deleting...','loading-status');
const r=await callAPI('admin_delete_key',{doc_id:id});
if(r.success){setStatus('✅ Deleted!','success-status');loadAllData();}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
async function addReseller(){const p=document.getElementById('resellerPass').value.trim();if(!p){setStatus('❌ Password required','error-status');return;}
const cr=parseInt(document.getElementById('resellerCredit').value)||50;
const ex=document.getElementById('resellerExpiry').value;
setStatus('⏳ Creating...','loading-status');
const r=await callAPI('admin_add_reseller',{password:p,credit:cr,expiry:ex});
if(r.success){setStatus('✅ Reseller created!','success-status');document.getElementById('resellerPass').value='';loadAllData();}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
function renderResellers(){const c=document.getElementById('resellerList');c.innerHTML='';if(currentData.resellers.length===0){c.innerHTML='<p style="text-align:center;color:#94a3b8;padding:20px;">No resellers yet</p>';return;}
currentData.resellers.forEach((item,i)=>{const d=document.createElement('div');d.className='reseller-item';const cr=item.credit||0;const uc=item.used_credit||0;
d.innerHTML=`<div class="reseller-info-header"><div>🆔 ${item.password}</div><div class="badges-holder"><div class="live-credit-badge">💳 ${cr}</div><div class="used-credit-badge">💸 ${uc}</div></div></div><div class="inputs-group-reseller"><input type="text" id="res_pass_${i}" value="${item.password}" placeholder="Password"><input type="number" id="res_credit_${i}" value="${cr}"><input type="date" id="res_exp_${i}" value="${item.expiry||''}"><div style="display:flex;gap:4px;"><button class="warning" onclick="updateReseller('${item.doc_id}')">💾</button><button class="danger" onclick="deleteReseller('${item.doc_id}')">🗑️</button></div></div>`;
c.appendChild(d);});}
async function updateReseller(id){const i=currentData.resellers.findIndex(r=>r.doc_id===id);if(i<0)return;
const r=await callAPI('admin_update_reseller',{doc_id:id,password:document.getElementById('res_pass_'+i).value.trim(),credit:parseInt(document.getElementById('res_credit_'+i).value)||0,expiry:document.getElementById('res_exp_'+i).value});
if(r.success){setStatus('✅ Updated!','success-status');loadAllData();}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
async function deleteReseller(id){if(!confirm("Delete this reseller?"))return;
const r=await callAPI('admin_delete_reseller',{doc_id:id});
if(r.success){setStatus('✅ Deleted!','success-status');loadAllData();}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
async function saveMaintenance(){setStatus('⏳ Saving...','loading-status');
const r=await callAPI('admin_update_config',{maintenance_enabled:document.getElementById('maintEnabled').checked,maintenance_message:document.getElementById('maintMsg').value.trim(),update_url:document.getElementById('maintUrl').value.trim(),min_app_version:document.getElementById('maintMinVer').value.trim(),latest_app_version:document.getElementById('maintLatestVer').value.trim(),lua_version:document.getElementById('maintLuaVer').value.trim(),update_zip_name:document.getElementById('maintZipName').value.trim()});
if(r.success){setStatus('✅ Config saved!','success-status');}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
async function handleLuaFiles(event){const files=event.target.files;if(!currentData.lua_files)currentData.lua_files={};
for(let file of files){const c=await file.text();currentData.lua_files[file.name]=btoa(c);}
renderLuaFilesList();setStatus('⚠️ Click Save Lua Files','loading-status');}
function renderLuaFilesList(){const c=document.getElementById('luaFilesContainer');c.innerHTML='';
for(let fn in currentData.lua_files){const d=document.createElement('div');d.className='lua-item';d.innerHTML=`<span>📄 <strong>${fn}</strong></span><button class="danger" onclick="deleteLuaFile('${fn}')" style="padding:6px 10px;font-size:11px;">🗑️</button>`;c.appendChild(d);}}
function deleteLuaFile(fn){delete currentData.lua_files[fn];renderLuaFilesList();}
async function saveLuaFiles(){const v=document.getElementById('luaVersionInput').value.trim();setStatus('⏳ Saving...','loading-status');
const r=await callAPI('admin_update_lua',{lua_version:v,lua_files:currentData.lua_files});
if(r.success){setStatus('✅ Saved!','success-status');}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
async function saveHtmlPanel(){const h=document.getElementById('appHtmlCode').value;setStatus('⏳ Saving...','loading-status');
const r=await callAPI('admin_update_html',{html:btoa(h)});
if(r.success){setStatus('✅ HTML saved!','success-status');}else{setStatus('❌ '+(r.error||'Failed'),'error-status');}}
window.onload=function(){const t=new Date().toISOString().split('T')[0];document.getElementById('resellerExpiry').value=t;
const sp=localStorage.getItem('admin_pass');if(sp===ADMIN_PASSWORD){document.getElementById('loginScreen').style.display='none';document.getElementById('mainApp').style.display='flex';loadAllData();}
document.getElementById('adminPass').addEventListener('keypress',function(e){if(e.key==='Enter')tryLogin();});};
</script>
